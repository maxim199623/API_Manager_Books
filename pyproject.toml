[tool.poetry]
name = "api_manager_books"
version = "0.1.0"
description = ""
authors = ["Melkor <Melkor@DESKTOP-2F8FHNT>"]
packages = [{ include = "api_manager_books", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
sqlalchemy = "^2.0.44"
aiosqlite = "^0.21.0"
asyncpg = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.12.4"}
fastapi = "^0.121.3"
uvicorn = "^0.38.0"
bcrypt = "^5.0.0"
cryptography = "^46.0.3"
pyjwt = "^2.10.1"
websockets = "^16.0"
python-multipart = "^0.0.29"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
ruff = "^0.13.0"


[tool.poetry.scripts]
api-manager-books = "api_manager_books.main:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

